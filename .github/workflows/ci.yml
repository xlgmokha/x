name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.26.x', '1.27.0-rc.2' ]
    continue-on-error: ${{ matrix.go-version == '1.27.0-rc.2' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - run: go vet ./...
    - run: go test -race -shuffle=on ./...
